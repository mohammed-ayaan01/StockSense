services:
  postgres:
    image: postgres:16-alpine
    container_name: stocksense-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stocksense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocksense}
      POSTGRES_DB: ${POSTGRES_DB:-stocksense}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stocksense}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stocksense-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stocksense-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-stocksense}:${POSTGRES_PASSWORD:-stocksense}@postgres:5432/${POSTGRES_DB:-stocksense}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production-32ch}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - OTP_EXPIRE_MINUTES=${OTP_EXPIRE_MINUTES:-10}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - DEBUG=${DEBUG:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stocksense-net
    volumes:
      - ./backend:/app
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stocksense-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - stocksense-net
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  stocksense-net:
    driver: bridge
